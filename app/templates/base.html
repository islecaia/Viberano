<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Invoice Manager{% endblock %}</title>
  <style>
    @font-face {
      font-family: "Montserrat";
      font-weight: 400 700;
      src: local("Montserrat");
    }
    :root {
      --primary: #0062FF;
      --bg: #FFFFFF;
      --surface-muted: #F5F7F7;
      --border: #DDE2E3;
      --text-primary: #3B4443;
      --text-secondary: #505C5F;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Montserrat", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      padding-bottom: 72px;
    }
    main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-weight: 700; font-size: 1.4rem; margin-bottom: 2px; }
    .page-subtitle {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin: 0 0 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card {
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      font-family: inherit;
      font-size: 1rem;
    }
    input.suggested, select.suggested {
      border-color: var(--primary-secondary, var(--primary));
      background: #EAF2FF;
    }
    .suggested-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--primary);
      background: #EAF2FF;
      border-radius: 8px;
      padding: 1px 6px;
      margin-left: 6px;
      vertical-align: middle;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 600;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    .button-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .button-row button { width: auto; flex: 1; }
    .button-row button.secondary { background: var(--surface-muted); color: var(--text-primary); border: 1px solid var(--border); }
    .status { font-weight: 600; font-size: 0.9rem; }
    .status.conectada { color: #1E9E5A; }
    .status.desconectada, .status.requiere_reautorizacion { color: #C4451C; }
    nav.bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    nav.bottom-nav a {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
    }
    nav.bottom-nav a.active { color: var(--primary); }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
  <nav class="bottom-nav">
    <a href="/facturas" class="{{ 'active' if active_tab == 'facturas' else '' }}">Facturas</a>
    <a href="/proveedores" class="{{ 'active' if active_tab == 'proveedores' else '' }}">Proveedores</a>
    <a href="/conciliacion" class="{{ 'active' if active_tab == 'conciliacion' else '' }}">Conciliación</a>
    <a href="/actividad" class="{{ 'active' if active_tab == 'actividad' else '' }}">Actividad</a>
  </nav>
</body>
</html>
