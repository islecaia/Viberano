<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión · Invoice Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #FFFFFF; color: #3B4443; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    form { width: 100%; max-width: 320px; padding: 24px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #DDE2E3; border-radius: 12px; margin-bottom: 12px; font-size: 1rem; box-sizing: border-box; }
    button { background: #0062FF; color: #fff; border: none; border-radius: 12px; padding: 12px 16px; font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%; }
    p.error { color: #C4451C; font-weight: 600; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <form id="login-form">
    <h1>Invoice Manager</h1>
    <label for="email">Email autorizado</label>
    <input id="email" name="email" type="email" required />
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required />
    <button type="submit">Entrar</button>
    <p class="error" id="login-error"></p>
  </form>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorEl = document.getElementById("login-error");
      errorEl.style.display = "none";
      const response = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      if (response.ok) {
        window.location.href = "/mailbox/connect";
      } else {
        errorEl.textContent = "Credenciales inválidas";
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
