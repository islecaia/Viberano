[project]
name = "invoice-manager"
version = "0.1.0"
description = "Herramienta web para identificar, validar y archivar facturas de gasto recibidas por email, con revisión humana obligatoria antes de cualquier escritura masiva."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "msgraph-sdk>=1.15",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
